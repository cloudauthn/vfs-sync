name: Pages

# Publishes the demo at / and the coverage report at /coverage/.
#
# There is no push trigger on purpose: the site is only rebuilt when a release
# bumps the version (release.yml calls this workflow), so what is published
# always matches the last published npm version.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit-ish to publish (defaults to the caller's ref)
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the demo into demo/dist and drops the HTML coverage report in
      # demo/dist/coverage.
      - run: npm run pages:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

      - id: deployment
        uses: actions/deploy-pages@v4
