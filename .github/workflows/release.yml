name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    outputs:
      new_tag: ${{ steps.bump_version.outputs.new_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Bump version, commit, and tag
        id: bump_version
        run: |
          NEW_TAG=$(npm version "${{ inputs.bump }}" -m "chore(release): %s")
          echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: npm publish preflight
        run: |
          npm config get registry
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Push commit and tag
        run: git push origin HEAD --follow-tags

      # dist/* hands gh the dist/adapters directory, which it refuses to upload
      # ("is a directory") before it gets to any of the files. The release
      # carries the published tarball and the browser bundle instead — the two
      # artefacts worth downloading by hand.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ steps.bump_version.outputs.new_tag }}
        run: |
          TARBALL=$(npm pack --silent | tail -1)
          gh release create "$NEW_TAG" \
            "$TARBALL#npm package tarball" \
            'dist/vfs-sync.global.js#browser bundle (IIFE, window.vfsSync)' \
            --title "$NEW_TAG" --generate-notes

  # GitHub Pages — the demo at / and the coverage report at /coverage/ — is
  # refreshed only by a release, and from the tag that was just published, so
  # the site always matches the last version on npm.
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.new_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the demo into demo/dist and drops the HTML coverage report in
      # demo/dist/coverage. VITE_GDRIVE_CLIENT_ID, when set, lights up the
      # "Connect Drive" button in the explorer; it is a public OAuth client id,
      # not a credential, so a repo variable is fine (a secret also works).
      - run: npm run pages:build
        env:
          VITE_GDRIVE_CLIENT_ID: ${{ vars.GDRIVE_CLIENT_ID }}
          # Optional. Defaults to drive.file (app sees only files it created).
          # Set the repo variable to https://www.googleapis.com/auth/drive to
          # let the explorer browse the user's whole Drive.
          VITE_GDRIVE_SCOPE: ${{ vars.GDRIVE_SCOPE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist

      - id: deployment
        uses: actions/deploy-pages@v4
