<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vfs-sync explorer</title>
    <meta
      name="description"
      content="Embeddable file explorer for @cloudauthn/vfs-sync: one tab per backend, wired as a sync chain."
    />
    <style>
      :root {
        color-scheme: dark;
        --page: #0e1116;
      }

      @media (prefers-color-scheme: light) {
        :root {
          color-scheme: light;
          --page: #f6f8fa;
        }
      }

      html,
      body {
        margin: 0;
        background: var(--page);
      }

      #app {
        padding: 16px;
        max-width: 1180px;
        margin-inline: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
